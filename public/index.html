<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ValuarAICoach</title>
    <meta name="description" content="Your Strava training data, at a glance." />
    <meta name="theme-color" content="#0b3d91" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="app-header">
      <img src="/icons/icon-192.png" alt="" class="logo" />
      <h1>ValuarAICoach</h1>
    </header>

    <main id="app">
      <p id="status" class="status">Loading your training data&hellip;</p>

      <section id="connect" class="connect hidden">
        <p>Connect your Strava account to see your training data here.</p>
        <a class="button" href="/auth/login">Connect to Strava</a>
      </section>

      <section id="summary" class="summary hidden"></section>

      <ul id="activities" class="activities"></ul>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
