name: Validate plugin

on:
  pull_request:
  push:
    branches:
      - main
      - codex/public-plugin

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
